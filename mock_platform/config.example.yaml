# Mock Shopee platform server — example config.
# Copy to config.yaml and tweak, or point MOCKSHOPEE_CONFIG at any file.

server:
  latency_ms: 0          # artificial delay added to every /api/v2 call
  error_rate: 0.0        # 0..1 — fraction of /api/v2 calls that return a retryable Shopee error (error_busy)
  rate_limit_rate: 0.0   # 0..1 — fraction that return HTTP 429 with Retry-After (exercises OSI backoff)

shops:
  count: 3               # how many fake Shopee shops to create at startup
  regions: [MY, VN, PH]  # round-robined across shops
  currencies: [MYR, VND, PHP]
  items_per_shop: 15

orders:
  seed_per_shop: 25      # orders generated per shop at startup
  default_status: READY_TO_SHIP   # status new/seeded orders get (so OSI pulls them as actionable)
  window_days: 7         # orders' create_time spread back over this many days
